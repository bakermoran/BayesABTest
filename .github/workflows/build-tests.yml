name: Build Status

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    - name: Install dependencies
      run: uv sync --locked
    - name: Lint with ruff
      run: uv run ruff check .
    - name: Test with pytest
      env:
        MPLBACKEND: Agg
      run: uv run pytest -n 4
